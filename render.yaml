services:
  - type: web
    name: crystal-scrims-manager
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && npm --prefix dashboard install && npm --prefix dashboard run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DB_DRIVER
        value: turso # Or sqlite / postgres
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: PORT
        value: 8080
    healthCheckPath: /health
